}

.paintable{

}

.btn{

    border:none;

<script>
let selectedColor = "#FFD84D";

const colorButtons =
    [...document.querySelectorAll(".color")];

const paintables =
    [...document.querySelectorAll(".paintable")];

colorButtons.forEach(button => {

    button.addEventListener("click", () => {

        selectedColor = button.dataset.color;

        colorButtons.forEach(b =>
            b.classList.remove("selected")
        );

        button.classList.add("selected");
    });

});

paintables.forEach(part => {

    part.addEventListener("pointerdown", e => {

        e.preventDefault();
        part.setAttribute("fill", selectedColor);

    });

});

document.getElementById("resetBtn")
.addEventListener("click", () => {

    paintables.forEach(part =>
        part.setAttribute("fill", "#ffffff")
    );

});
</script>

<script>
/* ===== ОТМЕНА ПОСЛЕДНЕГО ДЕЙСТВИЯ ===== */
(() => {
    const undoCanvas = document.getElementById("canvas");
    const undoBtn = document.getElementById("undoBtn");
    const resetBtn = document.getElementById("resetBtn");

    if (!undoCanvas || !undoBtn) return;

    const undoCtx = undoCanvas.getContext("2d");
    let undoSnapshot = null;

    function saveUndoState() {
        if (!undoCanvas.width || !undoCanvas.height) return;

        try {
            undoSnapshot = undoCtx.getImageData(
                0,
                0,
                undoCanvas.width,
                undoCanvas.height
            );

            undoBtn.disabled = false;
        } catch (e) {
            console.warn("Не удалось сохранить состояние", e);
        }
    }

    /* Сохраняем состояние перед новой заливкой */
    undoCanvas.addEventListener(
        "pointerdown",
        saveUndoState,
        true
    );

    /* Можно отменить и "Начать заново" */
    if (resetBtn) {
        resetBtn.addEventListener(
            "pointerdown",
            saveUndoState,
            true
        );
    }

    undoBtn.addEventListener("click", () => {
        if (!undoSnapshot) return;

        undoCtx.putImageData(
            undoSnapshot,
            0,
            0
        );

        undoSnapshot = null;
        undoBtn.disabled = true;
    });

    undoBtn.disabled = true;
})();
</script>


<script>
/* ===== SVG-ОТМЕНА ДЛЯ ПЧЁЛКИ МЕДОСЛАВА ===== */
(() => {

    const undoBtnBee = document.getElementById("undoBtn");
    const resetBtnBee = document.getElementById("resetBtn");

    if (!undoBtnBee) return;
    if (typeof paintables === "undefined") return;

    let lastBeeAction = null;

    /* Запоминаем цвет детали ДО раскрашивания */
    paintables.forEach(part => {

        part.addEventListener("pointerdown", () => {

            lastBeeAction = {
                type: "paint",
                part: part,
                oldFill: part.getAttribute("fill")
            };

            undoBtnBee.disabled = false;

        }, true);

    });

    /* Запоминаем всю раскраску перед "Начать заново" */
    if (resetBtnBee) {

        resetBtnBee.addEventListener("pointerdown", () => {

            lastBeeAction = {
                type: "reset",
                fills: Array.from(paintables).map(part => ({
                    part: part,
                    fill: part.getAttribute("fill")
                }))
            };

            undoBtnBee.disabled = false;

        }, true);

    }

    undoBtnBee.addEventListener("click", () => {

        if (!lastBeeAction) return;

        if (lastBeeAction.type === "paint") {

            if (lastBeeAction.oldFill === null) {
                lastBeeAction.part.removeAttribute("fill");
            } else {
                lastBeeAction.part.setAttribute(
                    "fill",
                    lastBeeAction.oldFill
                );
            }

        }

        if (lastBeeAction.type === "reset") {

            lastBeeAction.fills.forEach(item => {

                if (item.fill === null) {
                    item.part.removeAttribute("fill");
                } else {
                    item.part.setAttribute(
                        "fill",
                        item.fill
                    );
                }

            });

        }

        lastBeeAction = null;
        undoBtnBee.disabled = true;

    });

})();
</script>
