<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Прутик — раскраска</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#eef6eb;
    color:#344520;
}

.wrap{
    max-width:1100px;
    margin:auto;
    padding:10px 15px;
    text-align:center;
}

h1{
    margin:4px 0;
    color:#587229;
}

.palette{
    position:sticky;
    top:0;
    z-index:1000;
    background:#eef6eb;
    padding:7px 5px;
    border-radius:14px;

    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:8px;
    margin:8px 0;
}

.color{
    width:42px;
    height:42px;
    border-radius:50%;
    border:3px solid white;
    outline:2px solid #aaa;
}

.color.selected{
    outline:4px solid #222;
    transform:scale(1.08);
}

.tools{
    margin:6px 0;
}

.tool{
    border:none;
    border-radius:20px;
    padding:8px 14px;
    margin:3px;
    font-size:15px;
}

.tool.active{
    background:#587229;
    color:white;
}

.picture{
    max-width:min(620px, calc(100vh - 225px));
    margin:auto;
    background:white;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 5px 16px rgba(0,0,0,.16);
    touch-action:none;
}

canvas{
    display:block;
    width:100%;
    height:auto;
    touch-action:none;
}

.buttons{
    margin-top:8px;
}

.btn{
    display:inline-block;
    border:none;
    border-radius:22px;
    padding:9px 18px;
    margin:4px;
    font-size:16px;
    text-decoration:none;
}

.reset{
    background:#d79a32;
    color:white;
}

.back{
    background:#6b8e23;
    color:white;
}
</style>

<style>
/* ===== ЯРКАЯ КНОПКА ОТМЕНЫ ===== */
#undoBtn{
    background:#4267b2 !important;
    color:white !important;
    border:none !important;
    opacity:1 !important;
    font-weight:700 !important;
    box-shadow:0 3px 8px rgba(0,0,0,.18) !important;
}

#undoBtn:disabled{
    background:#8fa4cf !important;
    color:white !important;
    opacity:.75 !important;
}
</style>

</head>

<body>

<div class="wrap">

<h1>🌳 Прутик — раскраска</h1>

<div class="palette">

<button class="color selected"
data-color="#69B85A"
style="background:#69B85A"></button>

<button class="color"
data-color="#244C8F"
style="background:#244C8F"></button>

<button class="color"
data-color="#58B7F0"
style="background:#58B7F0"></button>

<button class="color"
data-color="#69B85A"
style="background:#69B85A"></button>

<button class="color"
data-color="#FFD84D"
style="background:#FFD84D"></button>

<button class="color"
data-color="#FF8A32"
style="background:#FF8A32"></button>

<button class="color"
data-color="#FF5B5B"
style="background:#FF5B5B"></button>

<button class="color"
data-color="#FF8FC4"
style="background:#FF8FC4"></button>

<button class="color"
data-color="#8B5A2B"
style="background:#8B5A2B"></button>

<button class="color"
data-color="#888888"
style="background:#888888"></button>

<button class="color"
data-color="#000000"
style="background:#000000"></button>

<button class="color"
data-color="#FFFFFF"
style="background:#FFFFFF"></button>

</div>

<div class="tools">

<button class="tool" data-size="16">
✏️ Тонкая
</button>

<button class="tool active" data-size="32">
🖌️ Средняя
</button>

<button class="tool" data-size="55">
🖍️ Толстая
</button>

</div>

<div class="picture">
<canvas id="canvas"></canvas>
</div>

<div class="buttons">


<button class="btn undo" id="undoBtn" type="button">
↩ Отменить
</button>

<button class="btn reset" id="clearBtn">
🔄 Начать заново
</button>

<a href="index.html" class="btn back">
← К раскраскам
</a>

</div>

</div>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const baseImage = new Image();
baseImage.src = "prutik_detailed.png";

let selectedColor = "#69B85A";
let brushSize = 32;
let painting = false;
let lastX = 0;
let lastY = 0;

let cropTop = 0;

function drawBase(){

    const cropTop = 0;
    const cropLeft = 0;
    const cropRight = 0;
    const cropBottom = 0;

    const sourceWidth =
        baseImage.naturalWidth - cropLeft - cropRight;

    const sourceHeight =
        baseImage.naturalHeight - cropTop - cropBottom;

    canvas.width = sourceWidth;
    canvas.height = sourceHeight;

    ctx.clearRect(0,0,canvas.width,canvas.height);

    ctx.drawImage(
        baseImage,
        cropLeft,
        cropTop,
        sourceWidth,
        sourceHeight,
        0,
        0,
        canvas.width,
        canvas.height
    );

    ctx.lineCap = "round";
    ctx.lineJoin = "round";
}

baseImage.onload = drawBase;


document.querySelectorAll(".color").forEach(button => {

    button.addEventListener("click", () => {

        selectedColor = button.dataset.color;

        document.querySelectorAll(".color")
        .forEach(b => b.classList.remove("selected"));

        button.classList.add("selected");
    });

});


document.querySelectorAll(".tool").forEach(button => {

    button.addEventListener("click", () => {

        brushSize = Number(button.dataset.size);

        document.querySelectorAll(".tool")
        .forEach(b => b.classList.remove("active"));

        button.classList.add("active");
    });

});


function getPoint(e){

    const rect = canvas.getBoundingClientRect();

    return {
        x:(e.clientX - rect.left) *
          (canvas.width / rect.width),

        y:(e.clientY - rect.top) *
          (canvas.height / rect.height)
    };
}


canvas.addEventListener("pointerdown", e => {

    painting = true;

    try{
        canvas.setPointerCapture(e.pointerId);
    }catch(err){}

    const p = getPoint(e);

    lastX = p.x;
    lastY = p.y;
});


canvas.addEventListener("pointermove", e => {

    if(!painting) return;

    const p = getPoint(e);

    ctx.beginPath();
    ctx.moveTo(lastX,lastY);
    ctx.lineTo(p.x,p.y);

    ctx.strokeStyle = selectedColor;
    ctx.globalAlpha = 0.56;
    ctx.lineWidth = brushSize;

    ctx.stroke();

    ctx.globalAlpha = 1;

    lastX = p.x;
    lastY = p.y;
});


function stopPainting(){
    painting = false;
}

canvas.addEventListener("pointerup",stopPainting);
canvas.addEventListener("pointercancel",stopPainting);
canvas.addEventListener("pointerleave",stopPainting);


document.getElementById("clearBtn")
.addEventListener("click", drawBase);

</script>


<!-- HERO-RETURN-BUTTON -->
<a href="../heroes/prutik.html"
   class="hero-return-button"
   aria-label="Вернуться к герою"
   style="
       position:fixed;
       left:16px;
       top:16px;
       z-index:9999;
       display:inline-block;
       padding:11px 18px;
       border-radius:28px;
       background:#6b8e23;
       color:white;
       text-decoration:none;
       font-family:Arial,sans-serif;
       font-size:16px;
       font-weight:bold;
       box-shadow:0 4px 12px rgba(0,0,0,.20);
   ">
← К Прутику
</a>


<script>
/* ===== ОТМЕНА ПОСЛЕДНЕГО ДЕЙСТВИЯ ===== */
(() => {
    const undoCanvas = document.getElementById("canvas");
    const undoBtn = document.getElementById("undoBtn");
    const undoClearBtn = document.getElementById("clearBtn");

    if (!undoCanvas || !undoBtn) return;

    const undoCtx = undoCanvas.getContext("2d");
    let undoSnapshot = null;

    function saveUndoState() {
        if (!undoCanvas.width || !undoCanvas.height) return;

        try {
            undoSnapshot = undoCtx.getImageData(
                0,
                0,
                undoCanvas.width,
                undoCanvas.height
            );
            undoBtn.disabled = false;
        } catch (e) {
            console.warn("Не удалось сохранить состояние для отмены", e);
        }
    }

    /*
      Сохраняем состояние ДО действия.
      Работает и для floodFill, и для рисования кистью.
    */
    undoCanvas.addEventListener("pointerdown", saveUndoState, true);

    /*
      Позволяет отменить и кнопку "Начать заново".
    */
    if (undoClearBtn) {
        undoClearBtn.addEventListener("pointerdown", saveUndoState, true);
    }

    undoBtn.addEventListener("click", () => {
        if (!undoSnapshot) return;

        undoCtx.putImageData(undoSnapshot, 0, 0);
        undoSnapshot = null;
        undoBtn.disabled = true;
    });

    undoBtn.disabled = true;
})();
</script>

</body>
</html>
