<script src="../script.js"></script>
   <script>
document.addEventListener("DOMContentLoaded", () => {

    const heroSoundButton =
        document.getElementById("heroSoundButton");

    const heroSoundOffBadge =
        document.getElementById("heroSoundOffBadge");

    const normalSoundButton =
        document.getElementById("sound-toggle");

    /* Убираем отдельную плавающую кнопку */
    if (normalSoundButton) {
        normalSoundButton.style.display = "none";
    }

    function updateHeroSoundButton() {

        const soundOn =
            window.medoSoundOn
                ? window.medoSoundOn()
                : localStorage.getItem("medoslavSound") !== "off";

        if (heroSoundOffBadge) {
            heroSoundOffBadge.style.display =
                soundOn ? "none" : "block";
        }
    }

    if (heroSoundButton) {

        heroSoundButton.addEventListener("click", (e) => {

            e.preventDefault();
            e.stopPropagation();

            if (normalSoundButton) {
                normalSoundButton.click();
            }

            updateHeroSoundButton();
        });
    }

    updateHeroSoundButton();
});
</script>
