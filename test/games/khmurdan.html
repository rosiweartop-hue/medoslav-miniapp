<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Хмурдан — Запомни заклинание</title>

<link rel="stylesheet" href="../style.css">

<style>
.game-wrap{
    max-width:850px;
    margin:25px auto;
    padding:20px;
    text-align:center;
}

.game-box{
    background:white;
    border-radius:25px;
    padding:25px;
    box-shadow:0 6px 20px rgba(0,0,0,.18);
}

.game-box h1{
    color:#63458a;
}

.level{
    font-size:20px;
    font-weight:bold;
    margin:15px 0;
}

.message{
    min-height:55px;
    font-size:21px;
    margin:15px 0;
}

.runes{
    display:grid;
    grid-template-columns:repeat(2,150px);
    justify-content:center;
    gap:20px;
    margin:25px auto;
}

.rune{
    width:150px;
    height:130px;
    border:none;
    border-radius:25px;
    font-size:65px;
    background:#eee7f8;
    box-shadow:0 5px 12px rgba(0,0,0,.15);
    cursor:pointer;
    touch-action:manipulation;
    transition:.15s;
}

.rune.active{
    background:#cfa9ff;
    transform:scale(1.10);
    box-shadow:0 0 25px #9d62d9;
}

.rune:active{
    transform:scale(.96);
}

.magic-btn,
.back-btn{
    display:inline-block;
    border:none;
    border-radius:28px;
    padding:13px 25px;
    font-size:18px;
    margin:8px;
    cursor:pointer;
    text-decoration:none;
}

.magic-btn{
    background:#7443a7;
    color:white;
}

.back-btn{
    background:#6b8e23;
    color:white;
}

.hidden{
    display:none;
}

@media(max-width:550px){
    .runes{
        grid-template-columns:repeat(2,120px);
    }

    .rune{
        width:120px;
        height:110px;
        font-size:55px;
    }
}
</style>
</head>

<body>

<div class="game-wrap">

<div class="game-box">

<h1>🧙‍♂️ Запомни заклинание</h1>

<p>
Хмурдан покажет волшебные знаки.<br>
Запомни их порядок и повтори.
</p>

<div class="level">
Уровень <span id="level">1</span> из 5
</div>


<button id="repeatVoiceBtn" type="button"
        style="
            display:block;
            margin:12px auto;
            padding:11px 20px;
            border:0;
            border-radius:24px;
            background:#2f6fed;
            color:white;
            font-size:17px;
            font-weight:700;
            cursor:pointer;
            box-shadow:0 4px 10px rgba(0,0,0,.18);
        ">
    🔊 Повторить задание
</button>

<div class="message" id="message">
Нажми «Показать заклинание»
</div>

<div class="runes">

<button class="rune" data-rune="0">⭐</button>
<button class="rune" data-rune="1">🌙</button>
<button class="rune" data-rune="2">⚡</button>
<button class="rune" data-rune="3">🍃</button>

</div>

<button class="magic-btn" id="showBtn">
✨ Показать заклинание
</button>

<a class="back-btn" href="index.html">
← Вернуться к играм
</a>

</div>
</div>


<script>
const runeButtons = [...document.querySelectorAll(".rune")];
const message = document.getElementById("message");
const levelText = document.getElementById("level");
const showBtn = document.getElementById("showBtn");

let level = 1;
let sequence = [];
let playerIndex = 0;
let showing = false;
let finished = false;

function wait(ms){
    return new Promise(resolve => setTimeout(resolve, ms));
}

function addRune(){
    sequence.push(Math.floor(Math.random() * 4));
}

async function showSequence(){

    if(showing) return;

    showing = true;
    playerIndex = 0;

    runeButtons.forEach(b => b.disabled = true);
    showBtn.disabled = true;

    message.textContent = "Смотри внимательно 👀";

    await wait(600);

    for(const rune of sequence){

        runeButtons[rune].classList.add("active");

        await wait(650);

        runeButtons[rune].classList.remove("active");

        await wait(280);
    }

    message.textContent = "Теперь повтори заклинание ✨";

    runeButtons.forEach(b => b.disabled = false);
    showBtn.disabled = false;

    showing = false;
}

function startLevel(){

    levelText.textContent = level;
    playerIndex = 0;
    finished = false;

    while(sequence.length < level + 1){
        addRune();
    }

    message.textContent = "Нажми «Показать заклинание»";
    showBtn.textContent = "✨ Показать заклинание";
}

runeButtons.forEach(button => {

    button.addEventListener("click", () => {

        if(showing || finished || sequence.length === 0) return;

        const selected = Number(button.dataset.rune);

        if(selected !== sequence[playerIndex]){

            playerIndex = 0;

            message.textContent =
                "Упс! Заклинание перепуталось 😊 Посмотри ещё раз.";

            showBtn.textContent = "👀 Показать ещё раз";

            return;
        }

        playerIndex++;

        if(playerIndex === sequence.length){

            finished = true;

            if(level < 5){

                message.textContent =
                    "🎉 Верно! Хмурдан вспомнил заклинание!";

                showBtn.textContent = "Следующий уровень →";

            } else {

                message.textContent =
                    "🏆 Отлично! Ты прошёл все 5 уровней!";

                showBtn.textContent = "🔄 Играть ещё";
            }
        }
    });
});

showBtn.addEventListener("click", async () => {

    if(finished){

        if(level < 5){

            level++;
            addRune();
            startLevel();
            await showSequence();

        } else {

            level = 1;
            sequence = [];
            addRune();
            addRune();
            startLevel();
        }

        return;
    }

    await showSequence();
});

addRune();
addRune();
startLevel();
</script>

<script src="../script.js"></script>


<!-- HERO-RETURN-BUTTON -->
<a href="../heroes/khmurdan.html"
   class="hero-return-button"
   aria-label="Вернуться к герою"
   style="
       position:fixed;
       left:16px;
       top:16px;
       z-index:9999;
       display:inline-block;
       padding:11px 18px;
       border-radius:28px;
       background:#6b8e23;
       color:white;
       text-decoration:none;
       font-family:Arial,sans-serif;
       font-size:16px;
       font-weight:bold;
       box-shadow:0 4px 12px rgba(0,0,0,.20);
   ">
← К Хмурдану
</a>



<script>
/* ===== ДЕТСКАЯ ОЗВУЧКА ХМУРДАНА ===== */
(() => {

    const repeatBtn = document.getElementById("repeatVoiceBtn");
    const gameMessage = document.getElementById("message");

    const voices = {
        task:   new Audio("../sounds/voices/khmurdan/task.m4a"),
        win:    new Audio("../sounds/voices/khmurdan/win.m4a"),
        wrong:  new Audio("../sounds/voices/khmurdan/wrong.mp3"),
        finish: new Audio("../sounds/voices/khmurdan/finish5.m4a")
    };

    Object.values(voices).forEach(audio => {
        audio.preload = "auto";
        audio.volume = 1;
    });

    let currentVoice = null;
    let firstTaskPlayed = false;

    function soundIsEnabled() {
        const value = localStorage.getItem("medoslavSound");

        return ![
            "off",
            "false",
            "0",
            "muted"
        ].includes(String(value).toLowerCase());
    }

    function stopVoice() {
        if (!currentVoice) return;

        try {
            currentVoice.pause();
            currentVoice.currentTime = 0;
        } catch (e) {}

        currentVoice = null;
    }

    function playVoice(audio) {
        if (!soundIsEnabled() || !audio) return;

        stopVoice();

        try {
            audio.currentTime = 0;
            currentVoice = audio;
            audio.play().catch(() => {});
        } catch (e) {}
    }

    function playTask() {
        playVoice(voices.task);
        firstTaskPlayed = true;
    }

    if (repeatBtn) {
        repeatBtn.addEventListener("click", playTask);
    }

    document.addEventListener(
        "pointerdown",
        () => {
            if (!firstTaskPlayed) {
                playTask();
            }
        },
        {once:true, capture:true}
    );

    setTimeout(() => {
        if (!firstTaskPlayed) {
            playTask();
        }
    }, 700);

    if (gameMessage) {

        let previousText = "";

        const observer = new MutationObserver(() => {

            const text = gameMessage.textContent.trim();

            if (!text) return;

            /* Ошибка может повторяться несколько раз */
            if (
                text === previousText &&
                !text.includes("Невер") &&
                !text.includes("ошиб") &&
                !text.includes("Попробуй")
            ) {
                return;
            }

            previousText = text;

            if (text.includes("Верно")) {
                playVoice(voices.win);
                return;
            }

            if (
                text.includes("Невер") ||
                text.includes("ошиб") ||
                text.includes("Попробуй")
            ) {
                playVoice(voices.wrong);
                return;
            }

            if (text.includes("прошёл все 5")) {
                playVoice(voices.finish);
            }

        });

        observer.observe(
            gameMessage,
            {
                childList:true,
                subtree:true,
                characterData:true
            }
        );
    }

})();
</script>



<script>
/* ===== ЗВУК ЗАКЛИНАНИЯ ХМУРДАНА ===== */
(() => {

    const gameMessage = document.getElementById("message");

    const spellAudio =
        new Audio("../sounds/games/khmurdan-spell.mp3");

    spellAudio.preload = "auto";
    spellAudio.volume = 0.9;

    function soundIsEnabled() {
        const value =
            localStorage.getItem("medoslavSound");

        return ![
            "off",
            "false",
            "0",
            "muted"
        ].includes(String(value).toLowerCase());
    }

    /* Подготавливаем звук первым касанием на телефоне */
    document.addEventListener(
        "pointerdown",
        async () => {
            try {
                spellAudio.volume = 0;
                await spellAudio.play();

                spellAudio.pause();
                spellAudio.currentTime = 0;
                spellAudio.volume = 0.9;
            } catch (e) {
                spellAudio.volume = 0.9;
            }
        },
        {once:true, capture:true}
    );

    function playSpellSound() {

        if (!soundIsEnabled()) return;

        try {
            spellAudio.pause();
            spellAudio.currentTime = 0;
            spellAudio.volume = 0.9;

            spellAudio.play().catch(() => {});
        } catch (e) {}
    }

    if (gameMessage) {

        let previousText = "";

        const observer =
            new MutationObserver(() => {

                const text =
                    gameMessage.textContent.trim();

                if (!text || text === previousText)
                    return;

                previousText = text;

                if (text.includes("Верно")) {

                    /*
                       Сначала звучит:
                       "Верно! Отличная память!"

                       Затем магический эффект.
                    */
                    setTimeout(() => {
                        playSpellSound();
                    }, 1500);
                }

            });

        observer.observe(
            gameMessage,
            {
                childList:true,
                subtree:true,
                characterData:true
            }
        );
    }

})();
</script>

</body>
</html>
