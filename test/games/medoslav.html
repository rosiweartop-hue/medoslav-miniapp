<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Где спряталась пчёлка?</title>

<link rel="stylesheet" href="../style.css">

<style>
.game-wrap{
    max-width:900px;
    margin:25px auto;
    padding:20px;
    text-align:center;
}

.game-box{
    background:white;
    border-radius:25px;
    padding:25px;
    box-shadow:0 6px 20px rgba(0,0,0,.18);
}

.game-box h1{
    color:#587229;
}

.info{
    font-size:20px;
    margin:12px 0;
}

.flowers{
    display:flex;
    justify-content:center;
    gap:25px;
    flex-wrap:wrap;
    margin:30px 0;
}

.flower{
    width:170px;
    height:170px;
    border:none;
    border-radius:50%;
    background:#fff4c7;
    font-size:90px;
    cursor:pointer;
    box-shadow:0 5px 12px rgba(0,0,0,.15);
    touch-action:manipulation;
}

.flower:active{
    transform:scale(.96);
}

.flower.used{
    opacity:.45;
}

.flower.correct{
    background:#e6ffd5;
}

.message{
    min-height:45px;
    font-size:22px;
    font-weight:bold;
    margin:15px;
}

.next-btn,
.back-btn{
    display:inline-block;
    border:none;
    border-radius:28px;
    padding:13px 25px;
    font-size:18px;
    cursor:pointer;
    text-decoration:none;
    margin:8px;
}

.next-btn{
    background:#d9a413;
    color:white;
}

.back-btn{
    background:#6b8e23;
    color:white;
}

.hidden{
    display:none;
}

@media(max-width:650px){
    .flower{
        width:125px;
        height:125px;
        font-size:68px;
    }

    .flowers{
        gap:12px;
    }
}
</style>
</head>

<body>

<div class="game-wrap">

<div class="game-box">

<h1>🐝 Где спряталась пчёлка?</h1>

<p>
Маленькая пчёлка спряталась за одним из цветков.
Найди её!
</p>

<div class="info">
Раунд <span id="round">1</span> из 5
&nbsp; • &nbsp;
Найдено пчёлок: <span id="score">0</span>
</div>

<div class="flowers">

<button class="flower" data-id="0">🌼</button>
<button class="flower" data-id="1">🌸</button>
<button class="flower" data-id="2">🌻</button>

</div>

<div class="message" id="message">
Выбирай цветок 👆
</div>

<button class="next-btn hidden" id="nextBtn">
Следующий раунд →
</button>

<a class="back-btn" href="index.html">
← Вернуться к играм
</a>

</div>
</div>

<script>
const flowers = [...document.querySelectorAll(".flower")];
const message = document.getElementById("message");
const nextBtn = document.getElementById("nextBtn");
const roundText = document.getElementById("round");
const scoreText = document.getElementById("score");

let round = 1;
let score = 0;
let hiddenBee = 0;
let roundFinished = false;

function startRound(){
    roundFinished = false;
    hiddenBee = Math.floor(Math.random() * 3);

    roundText.textContent = round;
    scoreText.textContent = score;

    message.textContent = "Выбирай цветок 👆";
    nextBtn.classList.add("hidden");

    flowers.forEach((flower, index) => {
        flower.disabled = false;
        flower.className = "flower";

        if(index === 0) flower.textContent = "🌼";
        if(index === 1) flower.textContent = "🌸";
        if(index === 2) flower.textContent = "🌻";
    });
}

flowers.forEach(flower => {

    flower.addEventListener("click", () => {

        if(roundFinished) return;

        const selected = Number(flower.dataset.id);

        if(selected === hiddenBee){

            roundFinished = true;
            score++;

            flower.textContent = "🐝";
            flower.classList.add("correct");

            message.textContent = "🎉 Нашлась! Молодец!";

            flowers.forEach(f => f.disabled = true);

            scoreText.textContent = score;

            if(round < 5){
                nextBtn.textContent = "Следующий раунд →";
            }else{
                nextBtn.textContent = "⭐ Посмотреть результат";
            }

            nextBtn.classList.remove("hidden");

        }else{

            flower.classList.add("used");
            flower.disabled = true;

            message.textContent = "Здесь её нет. Попробуй другой цветок 😊";
        }
    });
});

nextBtn.addEventListener("click", () => {

    if(round < 5){
        round++;
        startRound();
        return;
    }

    message.innerHTML =
        "🌟 Отлично! Ты нашёл все " + score +
        " пчёлок из 5!";

    nextBtn.textContent = "🔄 Играть ещё";

    nextBtn.onclick = () => {
        round = 1;
        score = 0;
        nextBtn.onclick = null;
        startRound();
    };
});

startRound();
</script>

<script src="../script.js"></script>


<!-- HERO-RETURN-BUTTON -->
<a href="../heroes/medoslav.html"
   class="hero-return-button"
   aria-label="Вернуться к герою"
   style="
       position:fixed;
       left:16px;
       top:16px;
       z-index:9999;
       display:inline-block;
       padding:11px 18px;
       border-radius:28px;
       background:#6b8e23;
       color:white;
       text-decoration:none;
       font-family:Arial,sans-serif;
       font-size:16px;
       font-weight:bold;
       box-shadow:0 4px 12px rgba(0,0,0,.20);
   ">
← К Медославу
</a>

</body>
</html>
