<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Где спряталась пчёлка?</title>

<link rel="stylesheet" href="../style.css">

<style>
.game-wrap{
    max-width:900px;
    margin:25px auto;
    padding:20px;
    text-align:center;
}

.game-box{
    background:white;
    border-radius:25px;
    padding:25px;
    box-shadow:0 6px 20px rgba(0,0,0,.18);
}

.game-box h1{
    color:#587229;
}

.info{
    font-size:20px;
    margin:12px 0;
}

.flowers{
    display:flex;
    justify-content:center;
    gap:25px;
    flex-wrap:wrap;
    margin:30px 0;
}

.flower{
    width:170px;
    height:170px;
    border:none;
    border-radius:50%;
    background:#fff4c7;
    font-size:90px;
    cursor:pointer;
    box-shadow:0 5px 12px rgba(0,0,0,.15);
    touch-action:manipulation;
}

.flower:active{
    transform:scale(.96);
}

.flower.used{
    opacity:.45;
}

.flower.correct{
    background:#e6ffd5;
}

.message{
    min-height:45px;
    font-size:22px;
    font-weight:bold;
    margin:15px;
}

.next-btn,
.back-btn{
    display:inline-block;
    border:none;
    border-radius:28px;
    padding:13px 25px;
    font-size:18px;
    cursor:pointer;
    text-decoration:none;
    margin:8px;
}

.next-btn{
    background:#d9a413;
    color:white;
}

.back-btn{
    background:#6b8e23;
    color:white;
}

.hidden{
    display:none;
}

@media(max-width:650px){
    .flower{
        width:125px;
        height:125px;
        font-size:68px;
    }

    .flowers{
        gap:12px;
    }
}
</style>
</head>

<body>

<div class="game-wrap">

<div class="game-box">

<h1>🐝 Где спряталась пчёлка?</h1>

<p>
Маленькая пчёлка спряталась за одним из цветков.
Найди её!
</p>

<div class="info">
Раунд <span id="round">1</span> из 5
&nbsp; • &nbsp;
Найдено пчёлок: <span id="score">0</span>
</div>

<div class="flowers">

<button class="flower" data-id="0">🌼</button>
<button class="flower" data-id="1">🌸</button>
<button class="flower" data-id="2">🌻</button>

</div>


<button id="repeatVoiceBtn" type="button"
        style="
            display:block;
            margin:12px auto;
            padding:11px 20px;
            border:0;
            border-radius:24px;
            background:#2f6fed;
            color:white;
            font-size:17px;
            font-weight:700;
            cursor:pointer;
            box-shadow:0 4px 10px rgba(0,0,0,.18);
        ">
    🔊 Повторить задание
</button>

<div class="message" id="message">
Выбирай цветок 👆
</div>

<button class="next-btn hidden" id="nextBtn">
Следующий раунд →
</button>

<a class="back-btn" href="index.html">
← Вернуться к играм
</a>

</div>
</div>

<script>
const flowers = [...document.querySelectorAll(".flower")];
const message = document.getElementById("message");
const nextBtn = document.getElementById("nextBtn");
const roundText = document.getElementById("round");
const scoreText = document.getElementById("score");

let round = 1;
let score = 0;
let hiddenBee = 0;
let roundFinished = false;

let wrongAttempts = 0;

function startRound(){
    wrongAttempts = 0;
    roundFinished = false;
    hiddenBee = Math.floor(Math.random() * 3);

    roundText.textContent = round;
    scoreText.textContent = score;

    message.textContent = "Выбирай цветок 👆";
    nextBtn.classList.add("hidden");

    flowers.forEach((flower, index) => {
        flower.disabled = false;
        flower.className = "flower";

        if(index === 0) flower.textContent = "🌼";
        if(index === 1) flower.textContent = "🌸";
        if(index === 2) flower.textContent = "🌻";
    });
}

flowers.forEach(flower => {

    flower.addEventListener("click", () => {

        if(roundFinished) return;

        const selected = Number(flower.dataset.id);

        if(selected === hiddenBee){

            roundFinished = true;
            score++;

            flower.textContent = "🐝";
            flower.classList.add("correct");

            message.textContent = "🎉 Нашлась! Молодец!";

            flowers.forEach(f => f.disabled = true);

            scoreText.textContent = score;

            if(round < 5){
                nextBtn.textContent = "Следующий раунд →";
            }else{
                nextBtn.textContent = "⭐ Посмотреть результат";
            }

            nextBtn.classList.remove("hidden");

        }else{

            flower.classList.add("used");
            /* flower остаётся доступным для повторной попытки */

            wrongAttempts++;

            if (wrongAttempts === 1) {
                message.textContent =
                    "Здесь её нет. Попробуй другой цветок 😊";
            } else {
                message.textContent =
                    "Упс... попробуй ещё раз 😊";
            }
        }
    });
});

nextBtn.addEventListener("click", () => {

    if(round < 5){
        round++;
        startRound();
        return;
    }

    message.innerHTML =
        "🌟 Отлично! Ты нашёл все " + score +
        " пчёлок из 5!";

    nextBtn.textContent = "🔄 Играть ещё";

    nextBtn.onclick = () => {
        round = 1;
        score = 0;
        nextBtn.onclick = null;
        startRound();
    };
});

startRound();
</script>

<script src="../script.js"></script>


<!-- HERO-RETURN-BUTTON -->
<a href="../heroes/medoslav.html"
   class="hero-return-button"
   aria-label="Вернуться к герою"
   style="
       position:fixed;
       left:16px;
       top:16px;
       z-index:9999;
       display:inline-block;
       padding:11px 18px;
       border-radius:28px;
       background:#6b8e23;
       color:white;
       text-decoration:none;
       font-family:Arial,sans-serif;
       font-size:16px;
       font-weight:bold;
       box-shadow:0 4px 12px rgba(0,0,0,.20);
   ">
← К Медославу
</a>



<script>
/* ===== ДЕТСКАЯ ОЗВУЧКА МЕДОСЛАВА ===== */
(() => {

    const repeatBtn = document.getElementById("repeatVoiceBtn");
    const gameMessage = document.getElementById("message");

    const voices = {
        task:   new Audio("../sounds/voices/medoslav/task.m4a"),
        wrong:  new Audio("../sounds/voices/medoslav/wrong.m4a"),
        retry:  new Audio("../sounds/voices/medoslav/retry.m4a"),
        win:    new Audio("../sounds/voices/medoslav/win.m4a"),
        finish: new Audio("../sounds/voices/medoslav/finish5.m4a")
    };

    Object.values(voices).forEach(audio => {
        audio.preload = "auto";
        audio.volume = 1;
    });

    let currentVoice = null;
    let firstTaskPlayed = false;

    function soundIsEnabled() {
        const value = localStorage.getItem("medoslavSound");

        return ![
            "off",
            "false",
            "0",
            "muted"
        ].includes(String(value).toLowerCase());
    }

    function stopVoice() {
        if (!currentVoice) return;

        try {
            currentVoice.pause();
            currentVoice.currentTime = 0;
        } catch (e) {}

        currentVoice = null;
    }

    function playVoice(audio) {
        if (!soundIsEnabled() || !audio) return;

        stopVoice();

        try {
            audio.currentTime = 0;
            currentVoice = audio;

            audio.play().catch(() => {});
        } catch (e) {}
    }

    function playTask() {
        playVoice(voices.task);
        firstTaskPlayed = true;
    }

    if (repeatBtn) {
        repeatBtn.addEventListener("click", playTask);
    }

    /*
       На телефоне первая озвучка запускается
       после первого касания, если автозапуск
       браузер заблокировал.
    */
    document.addEventListener(
        "pointerdown",
        () => {
            if (!firstTaskPlayed) {
                playTask();
            }
        },
        { once:true, capture:true }
    );

    /*
       Пробуем автоматически запустить задание.
    */
    setTimeout(() => {
        if (!firstTaskPlayed) {
            playTask();
        }
    }, 700);

    if (gameMessage) {

        let previousText = "";

        const observer = new MutationObserver(() => {

            const text = gameMessage.textContent.trim();

            if (!text) return;

            /*
               "Упс" может повторяться несколько раз,
               поэтому для него одинаковый текст
               разрешаем воспроизводить повторно.
            */
            if (
                text === previousText &&
                !text.includes("Упс")
            ) {
                return;
            }

            previousText = text;

            if (text.includes("Нашлась")) {
                playVoice(voices.win);
                return;
            }

            if (text.includes("Здесь её нет")) {
                playVoice(voices.wrong);
                return;
            }

            if (text.includes("Упс")) {
                playVoice(voices.retry);
                return;
            }

            if (
                text.includes("Отлично") &&
                (
                    text.includes("5") ||
                    text.includes("пчёл")
                )
            ) {
                playVoice(voices.finish);
            }

        });

        observer.observe(
            gameMessage,
            {
                childList:true,
                subtree:true,
                characterData:true
            }
        );
    }

})();
</script>






<script>
/* ===== ЗВУК ПЧЁЛКИ МЕДОСЛАВА ===== */
(() => {

    const gameMessage = document.getElementById("message");

    const beeAudio = new Audio("../sounds/games/bee-buzz.wav");
    beeAudio.preload = "auto";
    beeAudio.volume = 0.9;

    function soundIsEnabled() {
        const value = localStorage.getItem("medoslavSound");

        return ![
            "off",
            "false",
            "0",
            "muted"
        ].includes(String(value).toLowerCase());
    }

    /* Разрешаем воспроизведение звука на телефоне */
    document.addEventListener(
        "pointerdown",
        async () => {
            try {
                beeAudio.volume = 0;
                await beeAudio.play();
                beeAudio.pause();
                beeAudio.currentTime = 0;
                beeAudio.volume = 0.9;
            } catch (e) {
                beeAudio.volume = 0.9;
            }
        },
        {once:true, capture:true}
    );

    function playBeeBuzz() {

        if (!soundIsEnabled()) return;

        try {
            beeAudio.pause();
            beeAudio.currentTime = 0;
            beeAudio.volume = 0.9;

            beeAudio.play().catch(() => {});
        } catch (e) {}
    }

    if (gameMessage) {

        let previousText = "";

        const observer = new MutationObserver(() => {

            const text = gameMessage.textContent.trim();

            if (!text || text === previousText) return;
            previousText = text;

            if (text.toLowerCase().includes("нашлась")) {

                /* После фразы ждём 2 секунды */
                setTimeout(() => {
                    playBeeBuzz();
                }, 2000);
            }

        });

        observer.observe(
            gameMessage,
            {
                childList:true,
                subtree:true,
                characterData:true
            }
        );
    }

})();
</script>




</body>
</html>
