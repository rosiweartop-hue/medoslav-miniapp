<script>
const canvas = document.getElementById("maze");
const ctx = canvas.getContext("2d");

const message = document.getElementById("message");
const levelText = document.getElementById("levelText");
const nextBtn = document.getElementById("nextBtn");

let level = 1;
let dragging = false;
let finished = false;
let pointerId = null;

const player = {

    y:210,
    r:22
};

const levels = [

    // 6
    {
        start:{x:65,y:95},

        path:[
            {x:35,y:65,w:210,h:64},

            {x:302,y:171,w:64,h:150},

    // 7
    {

        ]

    {
        start:{x:60,y:348},

        path:[
            {x:30,y:320,w:140,h:56},
            {x:114,y:250,w:56,h:126},
            {x:114,y:250,w:145,h:56},
            {x:203,y:160,w:56,h:146},
            {x:203,y:160,w:145,h:56},
            {x:292,y:100,w:56,h:116},
            {x:292,y:100,w:150,h:56},
            {x:386,y:100,w:56,h:150},
            {x:386,y:194,w:145,h:56},
            {x:475,y:70,w:56,h:180},
            {x:475,y:70,w:210,h:56}
        ]

];

function currentLevel(){
    return levels[level - 1];
}

    const PATH_PADDING = 30;

function expandedPathRect(r){
    return {
        x: r.x - PATH_PADDING,
        y: r.y - PATH_PADDING,
        w: r.w + PATH_PADDING * 2,
        h: r.h + PATH_PADDING * 2
    };
}

function pointInsidePath(x,y){
    return currentLevel().path.some(r => {
        const road = expandedPathRect(r);

        return (
            x >= road.x &&
            x <= road.x + road.w &&
            y >= road.y &&
            y <= road.y + road.h
        );
    });
}

/* Проверяем, чтобы Прутик не проходил краем через траву */
function safePosition(x,y){

    const checkRadius = 15;

    const points = [
        [x,y],
        [x+checkRadius,y],
        [x-checkRadius,y],
        [x,y+checkRadius],
        [x,y-checkRadius],
        [x+11,y+11],
        [x-11,y+11],
        [x+11,y-11],
        [x-11,y-11]
    ];

    return points.every(p => pointInsidePath(p[0],p[1]));
}

/* Не даём быстро "перепрыгнуть" через траву */
function safeMovement(fromX,fromY,toX,toY){

    const distance = Math.hypot(toX-fromX,toY-fromY);
    const steps = Math.max(1, Math.ceil(distance / 5));

    for(let i=1;i<=steps;i++){

        const t = i / steps;

        const x = fromX + (toX-fromX)*t;
        const y = fromY + (toY-fromY)*t;

        if(!safePosition(x,y)){
            return false;
        }
    }

    return true;
}

function resetPlayer(text){

    const start = currentLevel().start;

    player.x = start.x;
    player.y = start.y;

    dragging = false;
    pointerId = null;
    finished = false;

    nextBtn.classList.add("hidden");

    message.textContent =
        text || "Поставь палец на Прутика 🌳";

    draw();
}

function draw(){

    ctx.clearRect(0,0,canvas.width,canvas.height);

    /* трава */
    ctx.fillStyle = "#d9efbf";
    ctx.fillRect(0,0,canvas.width,canvas.height);

    /* небольшие декоративные цветы */
    ctx.font = "22px sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    const decorations = [
        [45,55,"🌼"],
        [670,370,"🌸"],
        [650,45,"🌼"],
        [55,385,"🌸"]
    ];

    decorations.forEach(d=>{
        ctx.fillText(d[2],d[0],d[1]);
    });

    /* дорожка */
    ctx.fillStyle = "#e4c08b";

     currentLevel().path.forEach(r=>{
    const road = expandedPathRect(r);
    ctx.fillRect(road.x,road.y,road.w,road.h);
});   

    /* море */
    const sea = currentLevel().sea;

    ctx.beginPath();
    ctx.arc(sea.x,sea.y,39,0,Math.PI*2);
    ctx.fillStyle = "#78c9ef";
    ctx.fill();

    ctx.font = "34px sans-serif";
    ctx.fillText("🌊",sea.x,sea.y);

    /* Прутик */
    ctx.beginPath();
    ctx.arc(player.x,player.y,player.r,0,Math.PI*2);
    ctx.fillStyle = "#79a947";
    ctx.fill();

    ctx.font = "34px sans-serif";
    ctx.fillText("🌳",player.x,player.y);
}

function pointerPosition(e){

    const rect = canvas.getBoundingClientRect();

    return {
        x:(e.clientX-rect.left)*(canvas.width/rect.width),
        y:(e.clientY-rect.top)*(canvas.height/rect.height)
    };
}

canvas.addEventListener("pointerdown",e=>{

    if(finished) return;

    const p = pointerPosition(e);

    const distance =
        Math.hypot(p.x-player.x,p.y-player.y);

    if(distance <= 45){

        dragging = true;
        pointerId = e.pointerId;

        try{
            canvas.setPointerCapture(pointerId);
        }catch(err){}

        message.textContent =
            "Отлично! Веди Прутика к морю 🌊";
    }else{

        message.textContent =
            "Начни с Прутика 🌳";
    }
});

canvas.addEventListener("pointermove",e=>{

    if(!dragging || finished) return;
    if(pointerId !== null && e.pointerId !== pointerId) return;

    const p = pointerPosition(e);

    if(!safeMovement(player.x,player.y,p.x,p.y)){

        try{
            canvas.releasePointerCapture(e.pointerId);
        }catch(err){}

        resetPlayer(
            "🌿 Ой! Прутик сошёл с дорожки. Попробуем ещё раз!"
        );

        return;
    }

    player.x = p.x;
    player.y = p.y;

    const sea = currentLevel().sea;

    if(Math.hypot(player.x-sea.x,player.y-sea.y) < 46){

        finished = true;
        dragging = false;

        try{
            canvas.releasePointerCapture(e.pointerId);
        }catch(err){}

        if(level < 8){

            message.textContent =
                "🎉 Отлично! Прутик стал ещё ближе к морю!";

            nextBtn.textContent =
                "Следующий уровень →";

        }else{

            message.textContent =
                "🌊 Ура! Прутик прошёл весь путь и увидел море!";

            nextBtn.textContent =
                "🔄 Пройти ещё раз";
        }

        nextBtn.classList.remove("hidden");
    }

    draw();
});

canvas.addEventListener("pointerup",e=>{
    dragging = false;
    pointerId = null;
});

canvas.addEventListener("pointercancel",e=>{
    dragging = false;
    pointerId = null;
});

function goToNextLevel(){

    if(level < 8){
        level++;
    }else{
        level = 1;
    }

    levelText.textContent = level;
    resetPlayer();
}

nextBtn.addEventListener("pointerup", e => {
    e.preventDefault();
    goToNextLevel();
});

levelText.textContent = level;
resetPlayer();
</script>

<script>
/* ===== ДЕТСКАЯ ОЗВУЧКА ПРУТИКА ===== */
(() => {

    const repeatBtn = document.getElementById("repeatVoiceBtn");
    const gameMessage = document.getElementById("message");

    const voices = {
        task:   new Audio("../sounds/voices/prutik/task.m4a"),
        win:    new Audio("../sounds/voices/prutik/win.m4a"),
        finish: new Audio("../sounds/voices/prutik/finish.m4a")
    };

    Object.values(voices).forEach(audio => {
        audio.preload = "auto";
        audio.volume = 1;
    });

    let currentVoice = null;
    let firstTaskPlayed = false;

    function soundIsEnabled() {
        const value = localStorage.getItem("medoslavSound");

        return ![
            "off",
            "false",
            "0",
            "muted"
        ].includes(String(value).toLowerCase());
    }

    function stopVoice() {
        if (!currentVoice) return;

        try {
            currentVoice.pause();
            currentVoice.currentTime = 0;
        } catch (e) {}

        currentVoice = null;
    }

    function playVoice(audio) {
        if (!soundIsEnabled() || !audio) return;

        stopVoice();

        try {
            audio.currentTime = 0;
            currentVoice = audio;
            audio.play().catch(() => {});
        } catch (e) {}
    }

    function playTask() {
        playVoice(voices.task);
        firstTaskPlayed = true;
    }

    if (repeatBtn) {
        repeatBtn.addEventListener("click", playTask);
    }

    document.addEventListener(
        "pointerdown",
        () => {
            if (!firstTaskPlayed) {
                playTask();
            }
        },
        {once:true, capture:true}
    );

    setTimeout(() => {
        if (!firstTaskPlayed) {
            playTask();
        }
    }, 700);

    if (gameMessage) {

        let previousText = "";

        const observer = new MutationObserver(() => {

            const text = gameMessage.textContent.trim();

            if (!text) return;

            /*
               Подсказка "Начни с Прутика" может
               повторяться несколько раз.
            */
            if (
                text === previousText &&
                !text.includes("Начни с Прутика")
            ) {
                return;
            }

            previousText = text;

            if (text.includes("Начни с Прутика")) {
                playVoice(voices.task);
                return;
            }

            if (text.includes("стал ещё ближе к морю")) {
                playVoice(voices.win);
                return;
            }

            if (text.includes("прошёл весь путь")) {
                playVoice(voices.finish);
            }

        });

        observer.observe(
            gameMessage,
            {
                childList:true,
                subtree:true,
                characterData:true
            }
        );
    }

})();
</script>



<script>
/* ===== ЗВУК МОРЯ ПРУТИКА ===== */
(() => {

    const gameMessage = document.getElementById("message");

    const seaAudio =
        new Audio("../sounds/games/prutik-sea.wav");

    seaAudio.preload = "auto";
    seaAudio.volume = 0.75;

    let seaStopTimer = null;
    let seaStartTimer = null;

    function soundIsEnabled() {
        const value =
            localStorage.getItem("medoslavSound");

        return ![
            "off",
            "false",
            "0",
            "muted"
        ].includes(String(value).toLowerCase());
    }

    /* Подготавливаем звук на телефоне первым касанием */
    document.addEventListener(
        "pointerdown",
        async () => {
            try {
                seaAudio.volume = 0;
                await seaAudio.play();

                seaAudio.pause();
                seaAudio.currentTime = 0;
                seaAudio.volume = 0.75;
            } catch (e) {
                seaAudio.volume = 0.75;
            }
        },
        {once:true, capture:true}
    );

    function playSea(duration) {

        if (!soundIsEnabled()) return;

        clearTimeout(seaStopTimer);

        try {
            seaAudio.pause();
            seaAudio.currentTime = 0;
            seaAudio.volume = 0.75;

            seaAudio.play().catch(() => {});

            seaStopTimer = setTimeout(() => {
                seaAudio.pause();
                seaAudio.currentTime = 0;
            }, duration);

        } catch (e) {}
    }

    if (gameMessage) {

        let previousText = "";

        const observer =
            new MutationObserver(() => {

                const text =
                    gameMessage.textContent.trim();

                if (!text || text === previousText)
                    return;

                previousText = text;

                clearTimeout(seaStartTimer);

                /* Обычный пройденный уровень */
                if (text.includes("стал ещё ближе к морю")) {

                    seaStartTimer = setTimeout(() => {
                        playSea(3000);
                    }, 2000);

                    return;
                }

                /* Финал игры */
                if (text.includes("прошёл весь путь")) {

                    seaStartTimer = setTimeout(() => {
                        playSea(5000);
                    }, 2000);
                }

            });

        observer.observe(
            gameMessage,
            {
                childList:true,
                subtree:true,
                characterData:true
            }
        );
    }

})();
</script>
