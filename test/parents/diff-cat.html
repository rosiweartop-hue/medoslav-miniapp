    body{
      margin:0;

    .page-header{
      background:#6b8e23;
      color:white;
      text-align:center;
      padding:28px 16px;
    }
    .page-header h1{
      margin:0 0 10px;
      font-size:42px;
    }
    .page-header p{

    }
    .wrap{
      max-width:1100px;
      margin:0 auto;

    .task-card{
      background:white;
      border-radius:24px;

    .task-card h2{
      margin-top:0;

      font-size:34px;

    .task-card p{

      line-height:1.5;
    }
    .images{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:18px;
      margin-top:20px;
    }
    .img-box{
      background:#f8f8f8;
      border-radius:18px;
      padding:12px;
      text-align:center;
      border:2px solid #d9e3c0;
    }
    .img-box img{
      width:100%;
      height:auto;
      border-radius:12px;
      display:block;
    }
    .img-label{
      margin-top:10px;
      font-size:18px;
      color:#6b8e23;
      font-weight:bold;
    }
    .note{
      margin-top:20px;
      padding:16px 18px;
      background:#f7f4df;
      border-radius:16px;
      font-size:18px;
      line-height:1.5;
    }
    .back{
      display:inline-block;
      margin-top:28px;
      padding:14px 26px;
      background:#6b8e23;
      color:white;
      text-decoration:none;
      border-radius:999px;
      font-size:22px;
      font-weight:bold;
    }
    @media (max-width: 700px){
      .page-header h1{font-size:30px;}
      .task-card h2{font-size:26px;}
      .task-card p{font-size:18px;}
      .images{grid-template-columns:1fr;}
      .back{font-size:18px;}
    }
  
.printable-preview{
    margin-top:20px;
    text-align:center;
}

.printable-preview img{
    display:block;
    width:100%;
    max-width:900px;
    height:auto;
    margin:0 auto;
    border-radius:16px;
    border:1px solid #d7ddca;
    background:white;
}

.printable-actions{
    display:flex;
    justify-content:center;
    margin-top:18px;
}

.printable-actions a{
    display:inline-block;
    padding:12px 22px;
    border-radius:26px;
    background:#6b8e23;
    color:white;
    text-decoration:none;
    font-weight:bold;
    font-size:18px;
}
